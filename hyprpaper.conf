### Hyprpaper ###
# hyprpaper >= 0.8 syntax (the old `preload =` / `wallpaper = mon, path` lines were removed).
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
splash = false

# Empty monitor = fallback wallpaper for every monitor
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/bank/crow.png
    fit_mode = cover
}
